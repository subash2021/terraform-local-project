name: Terraform Kind Cluster CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v3

    # 1. Setup environment
    - name: Verify Docker
      run: |
        docker --version
        sudo systemctl start docker
        
    - name: Install Kind
      run: |
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/
        kind version

    - uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    # 2. Terraform operations
    - name: Terraform Init
      working-directory: ./dev-cluster
      run: terraform init

    - name: Terraform Apply
      working-directory: ./dev-cluster
      run: terraform apply -auto-approve

    # 3. Cluster verification with proper kubeconfig handling
    - name: Configure kubectl access
      run: |
        # Wait for cluster to be fully ready
        sleep 30
        
        # Get kubeconfig directly from Kind
        mkdir -p ~/.kube
        kind get kubeconfig --name dev-cluster > ~/.kube/config
        chmod 600 ~/.kube/config
        
        # Verify the context exists
        kubectl config get-contexts
        echo "KUBECONFIG=~/.kube/config" >> $GITHUB_ENV

    # 4. Cluster verification with health checks
    - name: Verify Cluster Status
      run: |
        # Check nodes
        kubectl get nodes
        # Verify control plane is ready
        kubectl wait --for=condition=Ready node --all --timeout=300s
        # Check system pods
        kubectl get pods -n kube-system

    # 5. Helm deployment
    - name: Install Helm
      run: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        helm version

    - name: Deploy NGINX
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo update
        helm upgrade --install my-nginx bitnami/nginx \
          --set service.type=ClusterIP \
          --namespace default \
          --wait \
          --timeout 5m

    - name: Verify Deployment
      run: |
        kubectl get pods
        kubectl get svc