name: Terraform Kind Cluster CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v3

    # 1. Setup environment
    - name: Setup Docker and Kind
      run: |
        sudo systemctl start docker
        sudo chmod 666 /var/run/docker.sock
        
        # Install Kind
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/
        
        # Install kubectl
        curl -LO "https://dl.k8s.io/release/v1.27.3/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/

    # 2. Terraform operations
    - name: Terraform Apply
      working-directory: ./dev-cluster
      run: terraform apply -auto-approve

    # 3. Cluster configuration - CRITICAL FIXES
    - name: Configure kubectl access
      id: kubeconfig
      run: |
        # Wait for cluster
        sleep 30
        
        # Get absolute path to kubeconfig
        KUBECONFIG_PATH="$HOME/.kube/config"
        mkdir -p $(dirname $KUBECONFIG_PATH)
        
        # Generate and verify kubeconfig
        kind get kubeconfig --name dev-cluster > $KUBECONFIG_PATH
        chmod 600 $KUBECONFIG_PATH
        
        # Verify connectivity
        kubectl --kubeconfig=$KUBECONFIG_PATH cluster-info
        
        # Store path for subsequent steps
        echo "kubeconfig_path=$KUBECONFIG_PATH" >> $GITHUB_OUTPUT
        echo "KUBECONFIG=$KUBECONFIG_PATH" >> $GITHUB_ENV

    # 4. Cluster verification - PROPER CONFIG PROPAGATION
    - name: Verify Cluster Status
      env:
        KUBECONFIG: ${{ steps.kubeconfig.outputs.kubeconfig_path }}
      run: |
        # Absolute path to kubeconfig
        CONFIG="${{ steps.kubeconfig.outputs.kubeconfig_path }}"
        
        # Verify context exists
        kubectl --kubeconfig=$CONFIG config get-contexts
        
        # Retry logic with proper config
        for i in {1..10}; do
          if kubectl --kubeconfig=$CONFIG get nodes; then
            break
          fi
          echo "Retrying... Attempt $i/10"
          sleep 10
        done
        
        # Final checks
        kubectl --kubeconfig=$CONFIG wait --for=condition=Ready nodes --all --timeout=300s
        kubectl --kubeconfig=$CONFIG get nodes -o wide