name: Terraform Kind Cluster CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v3

    # 1. Setup only what we need
    - name: Setup Environment
      run: |
        # Use GitHub's built-in Docker (no apt install needed)
        sudo chmod 666 /var/run/docker.sock
        
        # Install Kind
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/
        
        # Verify installations
        docker info
        kind version

    # 2. Setup Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    # 3. Terraform operations
    - name: Terraform Init
      working-directory: ./dev-cluster
      run: terraform init

    - name: Terraform Apply
      working-directory: ./dev-cluster
      run: terraform apply -auto-approve

    # 4. Cluster access
    - name: Configure kubectl
      run: |
        # Wait for cluster
        sleep 20
        
        # Get kubeconfig
        mkdir -p ~/.kube
        kind get kubeconfig --name dev-cluster > ~/.kube/config
        chmod 600 ~/.kube/config
        
        # Verify
        kubectl cluster-info --context kind-dev-cluster

    # 5. Cluster verification
    - name: Verify Cluster
      run: |
        kubectl wait --for=condition=Ready nodes --all --timeout=180s
        kubectl get nodes -o wide