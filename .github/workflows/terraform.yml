name: Terraform CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install Docker
      run: |
        sudo apt-get update
        sudo apt-get install -y apt-transport-https ca-certificates curl gnupg lsb-release
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y docker-ce docker-ce-cli containerd.io
        sudo systemctl start docker
        sudo systemctl enable docker
    - name: Install Kind
      run: |
        curl -Lo kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
        chmod +x kind
        [ ! -f ./kind ] && mv kind ./kind || true  # Move only if ./kind doesn't exist
        export PATH=$PATH:.
    - uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0
    - name: Navigate to dev-cluster and Format Check
      working-directory: ./dev-cluster
      run: terraform fmt -check
    - name: Navigate to dev-cluster and Initialize
      working-directory: ./dev-cluster
      run: terraform init
    - name: Navigate to dev-cluster and Validate
      working-directory: ./dev-cluster
      run: terraform validate
    - name: Navigate to dev-cluster and Apply
      working-directory: ./dev-cluster
      run: terraform apply -auto-approve
    - name: Install Helm
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo update
    - name: Uninstall Existing NGINX (if any)
      run: helm uninstall my-nginx -n default --kube-context kind-dev-cluster || true
      continue-on-error: true
    - name: Deploy NGINX
      run: |
        helm install my-nginx bitnami/nginx --set service.type=ClusterIP --namespace default --kube-context kind-dev-cluster