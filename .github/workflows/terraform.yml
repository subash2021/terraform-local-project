name: Terraform Kind Cluster CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v3

    # 1. Setup environment
    - name: Setup Docker
      run: |
        sudo systemctl start docker
        sudo chmod 666 /var/run/docker.sock
        docker info

    - name: Install Kind and kubectl
      run: |
        # Install Kind
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/
        
        # Install kubectl
        curl -LO "https://dl.k8s.io/release/v1.27.3/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/
        
        kind version
        kubectl version --client

    - uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    # 2. Terraform operations
    - name: Terraform Init
      working-directory: ./dev-cluster
      run: terraform init

    - name: Terraform Apply
      working-directory: ./dev-cluster
      run: terraform apply -auto-approve

    # 3. Cluster configuration - THE DEFINITIVE FIX
    - name: Configure kubectl access
      id: kubeconfig
      run: |
        # Wait for cluster
        sleep 45
        
        # Get fresh kubeconfig
        mkdir -p ~/.kube
        kind get kubeconfig --name dev-cluster > ~/.kube/config
        chmod 600 ~/.kube/config
        
        # Verify connectivity
        kubectl cluster-info --context kind-dev-cluster
        
        # Store config path for subsequent steps
        echo "kubeconfig_path=~/.kube/config" >> $GITHUB_OUTPUT
        echo "KUBECONFIG=~/.kube/config" >> $GITHUB_ENV

    # 4. Cluster verification
    - name: Verify Cluster Status
      env:
        KUBECONFIG: ${{ steps.kubeconfig.outputs.kubeconfig_path }}
      run: |
        # Explicitly set context
        kubectl config use-context kind-dev-cluster
        
        # Verify nodes
        for i in {1..10}; do
          if kubectl get nodes; then
            break
          fi
          echo "Retrying... Attempt $i/10"
          sleep 10
        done
        
        # Wait for readiness
        kubectl wait --for=condition=Ready nodes --all --timeout=300s
        kubectl get nodes -o wide

    # 5. Helm deployment
    - name: Install Helm
      env:
        KUBECONFIG: ${{ steps.kubeconfig.outputs.kubeconfig_path }}
      run: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        helm version

    - name: Deploy NGINX
      env:
        KUBECONFIG: ${{ steps.kubeconfig.outputs.kubeconfig_path }}
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo update
        helm upgrade --install my-nginx bitnami/nginx \
          --set service.type=ClusterIP \
          --namespace default \
          --wait \
          --timeout 5m

    - name: Verify Deployment
      env:
        KUBECONFIG: ${{ steps.kubeconfig.outputs.kubeconfig_path }}
      run: |
        kubectl get pods
        kubectl get svc