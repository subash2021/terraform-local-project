name: Terraform Kind Cluster CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  terraform-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Increased timeout for cluster operations
    steps:
    - uses: actions/checkout@v3

    # Prerequisite setup
    - name: Verify Docker
      run: |
        docker --version
        sudo systemctl start docker
        sudo systemctl enable docker

    - name: Install Kind
      run: |
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/
        kind version

    - uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    # Terraform operations
    - name: Terraform Init
      working-directory: ./dev-cluster
      run: terraform init

    - name: Terraform Validate
      working-directory: ./dev-cluster
      run: terraform validate

    - name: Terraform Apply
      working-directory: ./dev-cluster
      run: terraform apply -auto-approve

    # Cluster configuration
    - name: Configure kubectl access
      run: |
        # Wait for cluster to stabilize
        sleep 30
        
        # Export kubeconfig with proper permissions
        mkdir -p ~/.kube
        kind export kubeconfig --name dev-cluster --kubeconfig ~/.kube/config
        chmod 600 ~/.kube/config
        echo "KUBECONFIG=~/.kube/config" >> $GITHUB_ENV
        
        # Verify context exists
        kubectl config get-contexts

    - name: Verify Cluster Status
      run: |
        # Retry logic for cluster verification
        for i in {1..5}; do
          if kubectl cluster-info --context kind-dev-cluster; then
            echo "Cluster verified successfully"
            kubectl get nodes -o wide
            exit 0
          fi
          echo "Attempt $i/5: Cluster not ready, retrying in 15 seconds..."
          sleep 15
        done
        echo "ERROR: Failed to verify cluster after 5 attempts"
        exit 1

    - name: Wait for System Pods
      run: |
        kubectl wait --namespace kube-system \
          --for=condition=ready pod \
          --selector=tier=control-plane \
          --timeout=180s

    # Helm setup and deployment
    - name: Install Helm
      run: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        helm version
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo update

    - name: Deploy NGINX
      run: |
        helm upgrade --install my-nginx bitnami/nginx \
          --set service.type=ClusterIP \
          --namespace default \
          --kube-context kind-dev-cluster \
          --wait \
          --timeout 5m

    - name: Verify Deployment
      run: |
        kubectl get pods -n default
        kubectl get svc -n default