name: Terraform Kind Cluster CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v3

    # 1. Setup environment
    - name: Setup Docker
      run: |
        docker --version
        sudo systemctl start docker
        sudo chmod 666 /var/run/docker.sock

    - name: Install Kind and kubectl
      run: |
        # Install Kind
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/
        
        # Install specific kubectl version
        curl -LO "https://dl.k8s.io/release/v1.27.3/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/
        
        kind version
        kubectl version --client

    - uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    # 2. Terraform operations
    - name: Terraform Init
      working-directory: ./dev-cluster
      run: terraform init

    - name: Terraform Apply
      working-directory: ./dev-cluster
      run: terraform apply -auto-approve

    # 3. Cluster configuration - THE CRITICAL FIX
    - name: Configure kubectl access
      run: |
        # Wait for cluster
        sleep 30
        
        # Get fresh kubeconfig with internal IP
        mkdir -p ~/.kube
        kind get kubeconfig --internal --name dev-cluster > ~/.kube/config
        chmod 600 ~/.kube/config
        
        # Force kubectl to use the correct config
        export KUBECONFIG=~/.kube/config
        kubectl config use-context kind-dev-cluster
        
        # Verify connectivity
        kubectl config view
        echo "KUBECONFIG=~/.kube/config" >> $GITHUB_ENV

    # 4. Cluster verification
    - name: Verify Cluster Status
      run: |
        # First check
        kubectl get nodes
        
        # Wait with timeout
        kubectl wait --for=condition=Ready nodes --all --timeout=300s
        
        # Final verification
        kubectl get pods -n kube-system
        kubectl get nodes -o wide

    # 5. Helm deployment
    - name: Install Helm
      run: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        helm version

    - name: Deploy NGINX
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo update
        helm upgrade --install my-nginx bitnami/nginx \
          --set service.type=ClusterIP \
          --namespace default \
          --wait \
          --timeout 5m

    - name: Verify Deployment
      run: |
        kubectl get pods
        kubectl get svc