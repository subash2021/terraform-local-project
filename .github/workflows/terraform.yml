name: Terraform Kind Cluster CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v3

    # 1. Setup all dependencies
    - name: Setup Environment
      run: |
        # Install Docker
        sudo apt-get update
        sudo apt-get install -y docker.io
        sudo systemctl start docker
        sudo chmod 666 /var/run/docker.sock
        
        # Install Kind
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/
        
        # Install kubectl
        curl -LO "https://dl.k8s.io/release/v1.27.3/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/

    # 2. Setup Terraform PROPERLY
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0
        terraform_wrapper: false  # Important for direct execution

    # 3. Verify installations
    - name: Verify Tools
      run: |
        docker --version
        kind version
        kubectl version --client
        terraform version

    # 4. Terraform operations
    - name: Terraform Init
      working-directory: ./dev-cluster
      run: |
        terraform init

    - name: Terraform Apply
      working-directory: ./dev-cluster
      run: |
        terraform apply -auto-approve

    # 5. Cluster configuration
    - name: Configure kubectl access
      id: kubeconfig
      working-directory: ./dev-cluster
      run: |
        # Wait for cluster
        sleep 30
        
        # Get kubeconfig
        KUBECONFIG_PATH="$HOME/.kube/config"
        mkdir -p $(dirname $KUBECONFIG_PATH)
        kind get kubeconfig --name dev-cluster > $KUBECONFIG_PATH
        chmod 600 $KUBECONFIG_PATH
        
        # Verify
        kubectl --kubeconfig=$KUBECONFIG_PATH cluster-info
        
        # Store path
        echo "kubeconfig_path=$KUBECONFIG_PATH" >> $GITHUB_OUTPUT
        echo "KUBECONFIG=$KUBECONFIG_PATH" >> $GITHUB_ENV

    # 6. Cluster verification
    - name: Verify Cluster Status
      env:
        KUBECONFIG: ${{ steps.kubeconfig.outputs.kubeconfig_path }}
      run: |
        kubectl config use-context kind-dev-cluster
        kubectl wait --for=condition=Ready nodes --all --timeout=300s
        kubectl get nodes -o wide