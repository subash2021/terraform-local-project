name: Terraform Kind Cluster CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v3

    # 1. Setup environment
    - name: Setup Docker
      run: |
        docker --version
        sudo systemctl start docker
        # Ensure docker.sock has proper permissions
        sudo chmod 666 /var/run/docker.sock

    - name: Install Kind
      run: |
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/
        kind version

    - uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    # 2. Terraform operations
    - name: Terraform Init
      working-directory: ./dev-cluster
      run: terraform init

    - name: Terraform Apply
      working-directory: ./dev-cluster
      run: terraform apply -auto-approve

    # 3. Cluster configuration with robust kubeconfig handling
    - name: Configure kubectl access
      run: |
        # Wait for cluster components to initialize
        sleep 45
        
        # Get fresh kubeconfig with proper endpoints
        mkdir -p ~/.kube
        kind get kubeconfig --internal --name dev-cluster > ~/.kube/config
        chmod 600 ~/.kube/config
        
        # Update kubeconfig to use container's network
        sed -i 's/server: .*/server: https:\/\/$(docker inspect --format='{{.NetworkSettings.IPAddress}}' dev-cluster-control-plane):6443/' ~/.kube/config
        
        # Verify connectivity
        kubectl config view
        kubectl config get-contexts
        echo "KUBECONFIG=~/.kube/config" >> $GITHUB_ENV

    # 4. Cluster verification with proper health checks
    - name: Verify Cluster Status
      run: |
        # Wait for nodes to be ready
        kubectl wait --for=condition=Ready nodes --all --timeout=300s
        
        # Check system components
        kubectl get pods -n kube-system -w &
        sleep 30
        kubectl get nodes -o wide

    # 5. Helm deployment
    - name: Install Helm
      run: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        helm version

    - name: Deploy NGINX
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo update
        helm upgrade --install my-nginx bitnami/nginx \
          --set service.type=ClusterIP \
          --namespace default \
          --wait \
          --timeout 5m

    - name: Verify Deployment
      run: |
        kubectl get pods -w &
        sleep 15
        kubectl get svc