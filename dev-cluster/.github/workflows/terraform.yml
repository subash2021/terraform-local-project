name: Terraform CI
on:
  push:
    paths:
        - 'dev-cluster/**'
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
        run:
            shell: bash
    steps:
    - uses: actions/checkout@v3
    - uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0
    - run: terraform fmt -check
    - run: terraform init
    - run: terraform validate
